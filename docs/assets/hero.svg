<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
  <title id="t">codeontic — the model is your system's skeleton, code is a projection</title>
  <desc id="d">codeontic keeps a behavioral model as the stable skeleton of a system — the shape it is supposed to have. The code below is a projection of that skeleton, connected by anchors: fluid and rewritable, while the skeleton stays true. On the right, a bright model graph projects down onto faded, replaceable code files.</desc>

  <rect x="1" y="1" width="1198" height="358" rx="22" fill="#0b0e14" stroke="#1c2128" stroke-width="1.5"/>

  <!-- ── Title block ── -->
  <g transform="translate(64,0)" fill="#e6edf3">
    <text x="2" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" letter-spacing="3.5" fill="#7d8590">MODEL-DRIVEN ENGINEERING CONTROL</text>
    <text x="-2" y="168" font-size="88" font-weight="800" letter-spacing="-1">codeontic</text>
    <text x="2" y="216" font-size="21" fill="#adbac7">The model is your system's <tspan fill="#e6edf3" font-weight="600">skeleton</tspan>.</text>
    <text x="2" y="248" font-size="21" fill="#adbac7">Code is a projection — <tspan fill="#3fb950" font-weight="600">rewrite it freely</tspan>, the skeleton stays true.</text>

    <!-- the three payoffs -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14.5">
      <g transform="translate(2,296)">
        <rect x="0" y="0" width="118" height="34" rx="8" fill="#11161f" stroke="#1f2530" stroke-width="1"/>
        <text x="16" y="22" fill="#adbac7">understand</text>
      </g>
      <g transform="translate(132,296)">
        <rect x="0" y="0" width="132" height="34" rx="8" fill="#11161f" stroke="#1f2530" stroke-width="1"/>
        <text x="16" y="22" fill="#adbac7">refactor freely</text>
      </g>
      <g transform="translate(276,296)">
        <rect x="0" y="0" width="112" height="34" rx="8" fill="#11161f" stroke="#1f2530" stroke-width="1"/>
        <text x="16" y="22" fill="#adbac7">never drift</text>
      </g>
    </g>
  </g>

  <!-- ── Proof: the skeleton (model) projecting onto the code ── -->
  <g transform="translate(742,26)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="0" y="0" width="398" height="308" rx="16" fill="#0d1117" stroke="#1c2128" stroke-width="1.5"/>

    <!-- labels -->
    <text x="24" y="38" font-size="14" fill="#58a6ff" font-weight="600">MODEL</text>
    <text x="80" y="38" font-size="12.5" fill="#6e7681">· the skeleton (source of truth)</text>

    <!-- skeleton: model graph, bright/structural -->
    <g stroke="#58a6ff" stroke-width="2" fill="none">
      <path d="M74 92 L188 74"/>
      <path d="M188 74 L306 96"/>
      <path d="M188 74 L150 128"/>
    </g>
    <g fill="#0d1117" stroke="#58a6ff" stroke-width="2">
      <circle cx="74" cy="92" r="13"/>
      <circle cx="188" cy="74" r="13"/>
      <circle cx="306" cy="96" r="13"/>
      <circle cx="150" cy="128" r="11"/>
    </g>

    <!-- projection: anchors from skeleton nodes down to code -->
    <g stroke="#3fb950" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.55" fill="none">
      <path d="M74 105 L74 196"/>
      <path d="M188 87 L188 196"/>
      <path d="M306 109 L306 196"/>
    </g>

    <!-- code: a projection — faded, rewritable -->
    <text x="24" y="184" font-size="14" fill="#6e7681" font-weight="600">CODE</text>
    <text x="80" y="184" font-size="12.5" fill="#565d66">· a projection (rewrite freely ↻)</text>
    <g opacity="0.5" font-size="11" fill="#8b949e">
      <g transform="translate(24,200)">
        <rect x="0" y="0" width="108" height="60" rx="9" fill="#0b0e14" stroke="#30363d" stroke-width="1"/>
        <text x="14" y="24">order-svc.ts</text>
        <rect x="14" y="34" width="70" height="5" rx="2.5" fill="#21262d"/>
        <rect x="14" y="45" width="52" height="5" rx="2.5" fill="#21262d"/>
      </g>
      <g transform="translate(140,200)">
        <rect x="0" y="0" width="108" height="60" rx="9" fill="#0b0e14" stroke="#30363d" stroke-width="1"/>
        <text x="14" y="24">queue.ts</text>
        <rect x="14" y="34" width="66" height="5" rx="2.5" fill="#21262d"/>
        <rect x="14" y="45" width="44" height="5" rx="2.5" fill="#21262d"/>
      </g>
      <g transform="translate(256,200)">
        <rect x="0" y="0" width="108" height="60" rx="9" fill="#0b0e14" stroke="#30363d" stroke-width="1"/>
        <text x="14" y="24">sweeper.ts</text>
        <rect x="14" y="34" width="58" height="5" rx="2.5" fill="#21262d"/>
        <rect x="14" y="45" width="72" height="5" rx="2.5" fill="#21262d"/>
      </g>
    </g>

    <!-- caption -->
    <text x="24" y="290" font-size="12.5" fill="#7d8590">the skeleton stays true · the code is fluid</text>
  </g>
</svg>
