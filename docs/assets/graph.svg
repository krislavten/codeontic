<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
  <title id="t">codeontic — model-driven engineering control</title>
  <desc id="d">The behavioral model is the source of truth, pinned to real code and checked on every pull request. A small behavioral graph on the right shows loop and junction nodes colored by conformance status — met, partial, gap — with one node anchored to a real code symbol.</desc>

  <rect x="1" y="1" width="1198" height="358" rx="22" fill="#0b0e14" stroke="#1c2128" stroke-width="1.5"/>

  <!-- ── Title block ── -->
  <g transform="translate(64,0)" fill="#e6edf3">
    <text x="2" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" letter-spacing="3.5" fill="#7d8590">MODEL-DRIVEN ENGINEERING CONTROL</text>

    <text x="-2" y="168" font-size="88" font-weight="800" letter-spacing="-1">codeontic</text>

    <text x="2" y="216" font-size="21" fill="#adbac7">The model says how your system must behave.</text>
    <text x="2" y="248" font-size="21" fill="#adbac7">Pinned to real code, checked every PR — <tspan fill="#3fb950" font-weight="600">deterministic, zero-LLM</tspan>.</text>

    <!-- metadata chips -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14.5">
      <g transform="translate(2,296)">
        <rect x="0" y="0" width="182" height="34" rx="8" fill="#11161f" stroke="#1f2530" stroke-width="1"/>
        <text x="16" y="22" fill="#adbac7">npx codeontic init</text>
      </g>
      <g transform="translate(196,296)">
        <rect x="0" y="0" width="196" height="34" rx="8" fill="#11161f" stroke="#1f2530" stroke-width="1"/>
        <text x="16" y="22" fill="#adbac7">sub-second PR gate</text>
      </g>
      <g transform="translate(404,296)">
        <rect x="0" y="0" width="66" height="34" rx="8" fill="#11161f" stroke="#1f2530" stroke-width="1"/>
        <text x="16" y="22" fill="#adbac7">MIT</text>
      </g>
    </g>
  </g>

  <!-- ── Proof: behavioral graph fragment, colored by conformance, pinned to code ── -->
  <g transform="translate(742,26)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <!-- panel -->
    <rect x="0" y="0" width="398" height="308" rx="16" fill="#0d1117" stroke="#1c2128" stroke-width="1.5"/>

    <!-- edges (behind nodes) -->
    <g stroke-width="2" fill="none" opacity="0.85">
      <path d="M198 78 L110 150" stroke="#30363d"/>
      <path d="M198 78 L286 150" stroke="#30363d"/>
      <path d="M110 178 L196 236" stroke="#30363d"/>
    </g>

    <!-- junction (diamond) -->
    <g transform="translate(198,78)">
      <path d="M0 -24 L24 0 L0 24 L-24 0 Z" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
      <text x="0" y="5" font-size="12" fill="#58a6ff" text-anchor="middle">J1</text>
    </g>

    <!-- loop L1 — met (green) with loop glyph -->
    <g transform="translate(110,164)">
      <rect x="-40" y="-26" width="80" height="52" rx="12" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
      <path d="M12 -8 a11 11 0 1 1 -3 -8" fill="none" stroke="#3fb950" stroke-width="2"/>
      <path d="M9 -18 L12 -8 L2 -7" fill="none" stroke="#3fb950" stroke-width="2" stroke-linejoin="round"/>
      <text x="-20" y="5" font-size="13" fill="#e6edf3">L1</text>
    </g>

    <!-- loop L2 — partial (amber) -->
    <g transform="translate(286,164)">
      <rect x="-40" y="-26" width="80" height="52" rx="12" fill="#0d1117" stroke="#d29922" stroke-width="2"/>
      <text x="0" y="5" font-size="13" fill="#e6edf3" text-anchor="middle">L2</text>
    </g>

    <!-- loop L3 — gap (red) -->
    <g transform="translate(198,250)">
      <rect x="-40" y="-26" width="80" height="52" rx="12" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
      <text x="0" y="5" font-size="13" fill="#e6edf3" text-anchor="middle">L3</text>
    </g>

    <!-- anchor pin: L1 → real code symbol -->
    <g>
      <path d="M110 190 L70 232 L70 262" fill="none" stroke="#3fb950" stroke-width="1.6" stroke-dasharray="4 4" opacity="0.8"/>
      <circle cx="70" cy="232" r="3.5" fill="#3fb950"/>
      <text x="70" y="284" font-size="12.5" fill="#7d8590" text-anchor="middle">order-service.ts#OrderService</text>
    </g>

    <!-- legend -->
    <g font-size="12" transform="translate(300,26)">
      <circle cx="0" cy="-4" r="5" fill="#3fb950"/><text x="12" y="0" fill="#7d8590">met</text>
      <circle cx="0" cy="16" r="5" fill="#d29922"/><text x="12" y="20" fill="#7d8590">partial</text>
      <circle cx="0" cy="36" r="5" fill="#f85149"/><text x="12" y="40" fill="#7d8590">gap</text>
    </g>
  </g>
</svg>
