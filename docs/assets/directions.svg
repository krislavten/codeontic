<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
  <title id="t">codeontic — the model is the source of truth</title>
  <desc id="d">codeontic keeps a behavioral model as the source of truth and checks code against it in three directions: reconcile (code to model), coverage (the model's own anchoring), and conformance (model to code, graded met, partial or gap). Code aligns to the model, never the reverse.</desc>

  <rect x="1" y="1" width="1198" height="358" rx="22" fill="#0b0e14" stroke="#1c2128" stroke-width="1.5"/>

  <!-- ── Title block ── -->
  <g transform="translate(64,0)" fill="#e6edf3">
    <text x="2" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" letter-spacing="3.5" fill="#7d8590">MODEL-DRIVEN ENGINEERING CONTROL</text>
    <text x="-2" y="168" font-size="88" font-weight="800" letter-spacing="-1">codeontic</text>
    <text x="2" y="216" font-size="21" fill="#adbac7">One source of truth for how your system behaves —</text>
    <text x="2" y="248" font-size="21" fill="#adbac7">and three ways to prove the <tspan fill="#e6edf3" font-weight="600">code still matches it</tspan>.</text>
    <text x="2" y="312" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14.5" fill="#7d8590">code aligns to the model — never the reverse</text>
  </g>

  <!-- ── Proof: the three directions between MODEL and CODE ── -->
  <g transform="translate(742,26)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="0" y="0" width="398" height="308" rx="16" fill="#0d1117" stroke="#1c2128" stroke-width="1.5"/>

    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
      </marker>
      <marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/>
      </marker>
    </defs>

    <!-- MODEL node (source of truth) -->
    <g transform="translate(96,104)">
      <rect x="-62" y="-30" width="124" height="60" rx="13" fill="#0f1a12" stroke="#3fb950" stroke-width="2"/>
      <text x="0" y="-2" font-size="16" fill="#e6edf3" text-anchor="middle" font-weight="600">MODEL</text>
      <text x="0" y="17" font-size="11" fill="#3fb950" text-anchor="middle">source of truth</text>
    </g>

    <!-- CODE node -->
    <g transform="translate(300,214)">
      <rect x="-58" y="-28" width="116" height="56" rx="13" fill="#0d1117" stroke="#4b5563" stroke-width="2"/>
      <text x="0" y="5" font-size="16" fill="#adbac7" text-anchor="middle" font-weight="600">CODE</text>
    </g>

    <!-- conformance: MODEL -> CODE (graded) -->
    <path d="M150 128 C 215 150, 235 168, 258 192" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#ahg)"/>
    <text x="243" y="150" font-size="12.5" fill="#3fb950">conformance</text>
    <g transform="translate(243,162)">
      <circle cx="4" cy="0" r="4" fill="#3fb950"/><circle cx="18" cy="0" r="4" fill="#d29922"/><circle cx="32" cy="0" r="4" fill="#f85149"/>
    </g>

    <!-- reconcile: CODE -> MODEL -->
    <path d="M244 206 C 150 176, 120 168, 96 146" fill="none" stroke="#8b949e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/>
    <text x="96" y="200" font-size="12.5" fill="#8b949e">reconcile</text>

    <!-- coverage: MODEL self-loop -->
    <path d="M40 92 C 8 78, 8 130, 40 116" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#ah)"/>
    <text x="-2" y="70" font-size="12.5" fill="#58a6ff">coverage</text>

    <!-- direction labels -->
    <text x="150" y="270" font-size="11" fill="#6e7681">model → code</text>
    <text x="150" y="286" font-size="11" fill="#6e7681">code → model</text>
  </g>
</svg>
